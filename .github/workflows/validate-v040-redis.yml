name: Validate opensrc_wa v0.4.0 Redis lease

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: validate-opensrc-wa-v040-redis
  cancel-in-progress: false

jobs:
  validate:
    if: github.event.issue.user.login == github.repository_owner && github.event.issue.title == 'validate opensrc_wa v0.4.0 redis lease'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Enable toolchain
        run: |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate
          npm install --global typescript@5.8.3
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate source and Docker
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          {
            pnpm validate
            pnpm build
            cp .env.example .env
            docker compose config --quiet
            docker build --tag opensrc-wa:v0.4.0 .
          } 2>&1 | tee /tmp/redis-validation.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo 'Redis lease validation failed. Last 220 log lines:'
              echo '```text'
              tail -n 220 /tmp/redis-validation.log
              echo '```'
            } > /tmp/comment.md
            gh issue comment "${{ github.event.issue.number }}" --body-file /tmp/comment.md
            exit "$status"
          fi
      - name: Update validation evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test_count=$(grep '^# tests ' /tmp/redis-validation.log | tail -n 1 | awk '{print $3}')
          test_count=${test_count:-unknown}
          cat > docs/VALIDATION_V040.md <<EOF
          # opensrc_wa v0.4.0 Validation Evidence

          Validation source commit: \`${GITHUB_SHA}\`

          The following checks passed on GitHub-hosted Ubuntu:

          - frozen dependency installation with pnpm 10.14.0;
          - lint and format checks;
          - strict TypeScript type-check;
          - automated test suite (reported tests: ${test_count});
          - QR, SQLite auth, SQLite lease, Redis distributed lease, queue, object-store, interactive-message, broadcast, delete-scope, and native-blocker tests;
          - documentation policy checks;
          - dependency-boundary checks;
          - license checks;
          - TypeScript production build;
          - Docker Compose configuration validation;
          - Docker image build for \`opensrc-wa:v0.4.0\`.

          Live WhatsApp E2E was not executed because it requires a user-owned account and device. Native WebSocket/Noise/Signal connectivity remains \`BLOCKED\` and was not fabricated.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/VALIDATION_V040.md
          git commit -m "ci: record Redis lease validation" || true
          git push origin HEAD:main
          gh issue close "${{ github.event.issue.number }}" --comment "Redis distributed lease validation passed and docs/VALIDATION_V040.md was updated."
