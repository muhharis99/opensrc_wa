name: Validate opensrc_wa v0.3.0 final

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: validate-opensrc-wa-v030-final-retry
  cancel-in-progress: false

jobs:
  validate:
    if: github.event.issue.user.login == github.repository_owner && github.event.issue.title == 'validate opensrc_wa v0.3.0 final'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate
          npm install --global typescript@5.8.3

      - name: Run final validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          {
            pnpm install --frozen-lockfile
            pnpm validate
            pnpm build
            cp .env.example .env
            docker compose config --quiet
            docker build --tag opensrc-wa:v0.3.0 .
          } 2>&1 | tee /tmp/final-validation.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo 'Final validation failed. Last 160 log lines:'
              echo '```text'
              tail -n 160 /tmp/final-validation.log
              echo '```'
            } > /tmp/comment.md
            gh issue comment "${{ github.event.issue.number }}" --body-file /tmp/comment.md
            exit "$status"
          fi

      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "Final validation passed: locked install, source validation, 32 tests, TypeScript build, Docker Compose validation, and Docker image build."
