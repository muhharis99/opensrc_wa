name: Finalize opensrc_wa v0.4.0

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: finalize-opensrc-wa-v040
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.issue.user.login == github.repository_owner && github.event.issue.title == 'finalize opensrc_wa v0.4.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Enable toolchain
        run: |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate
          npm install --global typescript@5.8.3

      - name: Generate locked dependency graph
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile
          pnpm install --frozen-lockfile

      - name: Validate source and containers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          {
            pnpm validate
            pnpm build
            cp .env.example .env
            docker compose config --quiet
            docker build --tag opensrc-wa:v0.4.0 .
          } 2>&1 | tee /tmp/v040-validation.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo 'v0.4.0 validation failed. Last 220 log lines:'
              echo '```text'
              tail -n 220 /tmp/v040-validation.log
              echo '```'
            } > /tmp/comment.md
            gh issue comment "${{ github.event.issue.number }}" --body-file /tmp/comment.md
            exit "$status"
          fi

      - name: Record validation evidence and lockfile
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test_count=$(grep '^# tests ' /tmp/v040-validation.log | tail -n 1 | awk '{print $3}')
          test_count=${test_count:-unknown}
          cat > docs/VALIDATION_V040.md <<EOF
          # opensrc_wa v0.4.0 Validation Evidence

          Validation source commit: \`${GITHUB_SHA}\`

          The following checks passed on GitHub-hosted Ubuntu:

          - locked dependency generation and frozen installation with pnpm 10.14.0;
          - lint and format checks;
          - strict TypeScript type-check;
          - automated test suite (reported tests: ${test_count});
          - documentation policy checks;
          - dependency-boundary checks;
          - license checks;
          - TypeScript production build;
          - Docker Compose configuration validation;
          - Docker image build for \`opensrc-wa:v0.4.0\`.

          Live WhatsApp E2E was not executed because it requires a user-owned account and device. Native WebSocket/Noise/Signal connectivity remains \`BLOCKED\` and was not fabricated.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml docs/VALIDATION_V040.md
          if git diff --cached --quiet; then
            echo "No finalization changes required."
          else
            git commit -m "build: finalize opensrc_wa v0.4.0"
            git push origin HEAD:main
          fi
          gh issue close "${{ github.event.issue.number }}" --comment "v0.4.0 validation passed. Lockfile and validation evidence were committed. Live E2E remains opt-in for a user-owned account/device."
