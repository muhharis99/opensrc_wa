name: Bootstrap source repository

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap-source.yml"

permissions:
  contents: write

concurrency:
  group: bootstrap-source-main
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check source parts
        id: parts
        shell: bash
        run: |
          set -euo pipefail
          count="$(find .bootstrap -maxdepth 1 -type f -name 'source.part.*' 2>/dev/null | wc -l | tr -d ' ')"
          if [ "$count" = "3" ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "Bootstrap source is incomplete: $count/3 parts."
          fi

      - name: Extract and publish source
        if: steps.parts.outputs.complete == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat $(find .bootstrap -maxdepth 1 -type f -name 'source.part.*' | sort) | base64 --decode > /tmp/opensrc_wa-source.tar.xz
          mkdir -p /tmp/opensrc_wa-source
          tar -xJf /tmp/opensrc_wa-source.tar.xz -C /tmp/opensrc_wa-source

          shopt -s dotglob nullglob
          for item in *; do
            if [ "$item" != ".git" ]; then
              rm -rf "$item"
            fi
          done
          cp -a /tmp/opensrc_wa-source/. .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish opensrc_wa source foundation"
          git push origin HEAD:main
