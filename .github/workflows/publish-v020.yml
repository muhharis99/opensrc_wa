name: Publish opensrc_wa v0.2.0

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-opensrc-wa-v020
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.issue.title == 'publish opensrc_wa v0.2.0' && contains(github.event.issue.body, 'a7debaccea3909cbd47ca50050041115c4072796ce3a79aa6866bb90ba12b5a7')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source package
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .bootstrap -maxdepth 1 -type f -name 'source.part.*' | wc -l | tr -d ' ')" = "6"
          test "$(find .bootstrap -maxdepth 1 -type f -name 'source.tail.hex.*' | wc -l | tr -d ' ')" = "5"
          cat $(find .bootstrap -maxdepth 1 -type f -name 'source.part.*' | sort) > /tmp/opensrc_wa-v0.2.0.b64
          cat $(find .bootstrap -maxdepth 1 -type f -name 'source.tail.hex.*' | sort) | python3 -c 'import sys; sys.stdout.buffer.write(bytes.fromhex(sys.stdin.read()))' >> /tmp/opensrc_wa-v0.2.0.b64
          base64 --decode /tmp/opensrc_wa-v0.2.0.b64 > /tmp/opensrc_wa-v0.2.0.tar.xz
          echo "a7debaccea3909cbd47ca50050041115c4072796ce3a79aa6866bb90ba12b5a7  /tmp/opensrc_wa-v0.2.0.tar.xz" | sha256sum --check

      - name: Publish validated source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/opensrc_wa-v0.2.0
          tar -xJf /tmp/opensrc_wa-v0.2.0.tar.xz -C /tmp/opensrc_wa-v0.2.0
          shopt -s dotglob nullglob
          for item in *; do
            if [ "$item" != ".git" ]; then
              rm -rf "$item"
            fi
          done
          cp -a /tmp/opensrc_wa-v0.2.0/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add broad mock feature parity runtime"
          git push origin HEAD:main

      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "opensrc_wa v0.2.0 source published to main."
