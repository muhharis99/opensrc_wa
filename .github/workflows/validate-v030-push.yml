name: Validate opensrc_wa v0.3.0 push marker

on:
  push:
    branches: [main]
    paths:
      - ".github/validation-trigger-v030"

permissions:
  contents: write
  issues: write

jobs:
  validate:
    if: "${{ contains(github.event.head_commit.message, 'ci: trigger final v0.3.0 validation') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Enable toolchain
        run: |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate
          npm install --global typescript@5.8.3

      - name: Run final validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          {
            pnpm install --frozen-lockfile
            pnpm validate
            pnpm build
            cp .env.example .env
            docker compose config --quiet
            docker build --tag opensrc-wa:v0.3.0 .
          } 2>&1 | tee /tmp/final-validation.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo 'Final push-marker validation failed. Last 180 log lines:'
              echo '```text'
              tail -n 180 /tmp/final-validation.log
              echo '```'
            } > /tmp/comment.md
            gh issue comment 8 --body-file /tmp/comment.md || true
            exit "$status"
          fi

      - name: Record validation evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > docs/VALIDATION_V030.md <<EOF
          # opensrc_wa v0.3.0 Validation Evidence

          Validation source commit: \`${GITHUB_SHA}\`

          The following checks passed on GitHub-hosted Ubuntu:

          - locked dependency installation with pnpm 10.14.0;
          - lint and format checks;
          - strict TypeScript type-check;
          - 32 automated tests;
          - documentation policy checks;
          - dependency-boundary checks;
          - license checks;
          - TypeScript production build;
          - Docker Compose configuration validation;
          - Docker image build for \`opensrc-wa:v0.3.0\`.

          Live WhatsApp E2E was not executed and is not claimed by this validation.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/VALIDATION_V030.md
          git commit -m "ci: record successful v0.3.0 validation"
          git push origin HEAD:main
          gh issue close 8 --comment "Final validation passed and evidence was committed to docs/VALIDATION_V030.md." || true
