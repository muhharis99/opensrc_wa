services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: opensrc-wa:local
    restart: unless-stopped
    env_file:
      - .env
    command: ["node", "dist/apps/gateway/src/index.js"]
    ports:
      - "3000:3000"
    volumes:
      - opensrc_wa_runtime:/app/runtime
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  live-gateway:
    image: opensrc-wa:local
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    env_file:
      - .env
    command: ["node", "dist/apps/live-gateway/src/index.js"]
    ports:
      - "3001:3001"
    volumes:
      - opensrc_wa_runtime:/app/runtime
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  opensrc_wa_runtime:
