services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: opensrc-wa:local
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - opensrc_wa_runtime:/app/runtime
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  opensrc_wa_runtime:
